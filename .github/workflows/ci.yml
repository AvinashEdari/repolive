name: Verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "apps/api[dev]"
      - run: python -m ruff check apps/api
      - run: python -m ruff format --check apps/api
      - run: python -m mypy apps/api/app
      - run: python -m pytest apps/api/tests -q
      - name: Validate migrations and fresh database
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite:///./ci-migrations.db
        run: |
          python -m alembic -c alembic.ini upgrade head
          python -m alembic -c alembic.ini downgrade base
          python -m alembic -c alembic.ini upgrade head
          DATABASE_URL=postgresql+psycopg://user:password@invalid.example/repolive \
            python -m alembic -c alembic.ini upgrade head --sql > /tmp/postgresql-ddl.sql

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
        working-directory: .
