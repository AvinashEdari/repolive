services:
  - type: web
    name: repolive-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install .
    startCommand: alembic -c alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: DATABASE_MAX_OVERFLOW
        value: "5"
      - key: DATABASE_POOL_TIMEOUT_SECONDS
        value: "10"
      - key: DATABASE_POOL_RECYCLE_SECONDS
        value: "300"
      - key: DATABASE_CONNECT_TIMEOUT_SECONDS
        value: "10"
      - key: WEB_ORIGIN
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: AUTH_JWKS_TIMEOUT_SECONDS
        value: "5"
      - key: GITHUB_TOKEN
        sync: false
      - key: ANALYSIS_VERSION
        value: "1"
      - key: GITHUB_REQUEST_TIMEOUT_SECONDS
        value: "15"
      - key: FREE_ANONYMOUS_ANALYSIS_LIMIT
        value: "5"
      - key: FREE_AUTHENTICATED_ANALYSIS_LIMIT
        value: "50"
      - key: MAX_REQUEST_BODY_BYTES
        value: "24576"
      - key: MAX_REPOSITORY_FILES
        value: "10000"
      - key: MAX_REPOSITORY_BYTES
        value: "104857600"
      - key: MAX_REPOSITORY_PATH_BYTES
        value: "1024"
      - key: MAX_EVIDENCE_FILES
        value: "40"
      - key: MAX_EVIDENCE_FILE_BYTES
        value: "262144"
      - key: MAX_EVIDENCE_TOTAL_BYTES
        value: "2097152"
      - key: ANALYTICS_ENDPOINT
        sync: false
      - key: ANALYTICS_WRITE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: STRIPE_PORTAL_RETURN_URL
        value: https://repolive-web.vercel.app/account
      - key: ADMIN_USER_IDS
        sync: false
      - key: API_KEY_PEPPER
        generateValue: true
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
