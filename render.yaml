services:
  - type: web
    name: repolive-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install .
    startCommand: alembic -c alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: ANALYSIS_VERSION
        value: "1"
