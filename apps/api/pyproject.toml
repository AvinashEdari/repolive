[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "repolive-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi==0.141.1",
  "httpx>=0.28.1,<0.29",
  "pyjwt[crypto]>=2.10,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.43,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.35,<0.36"
]

[project.optional-dependencies]
dev = ["mypy>=1.17,<2", "pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<0.13"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app"]
